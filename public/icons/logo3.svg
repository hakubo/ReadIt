<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="40" ry="40"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- White background -->
    <rect width="512" height="512" fill="#FFFFFF"/>

    <!-- Page body — white with diagonal cut at top-right -->
    <path d="
      M 0 0
      H 422
      L 512 90
      V 512
      H 0
      Z
    " fill="#F5F2EB"/>

    <!-- Fold flap — mirrored corner with rounded bottom-left tip -->
    <path d="
      M 422 0
      L 512 90
      H 452
      Q 422 90 422 60
      Z
    " fill="#EBE5D5"/>

    <!-- Shadow along crease line -->
    <line x1="422" y1="0" x2="512" y2="90" stroke="#C5BFB0" stroke-width="1" opacity="0.35"/>

    <!-- Document lines — evenly spaced -->
    <line x1="56" y1="112" x2="456" y2="112" stroke="#E8E2D2" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="192" x2="456" y2="192" stroke="#E8E2D2" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="272" x2="456" y2="272" stroke="#E8E2D2" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="352" x2="456" y2="352" stroke="#E8E2D2" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="432" x2="456" y2="432" stroke="#E8E2D2" stroke-width="3" stroke-linecap="round"/>

    <!-- Waveform bars: 15 vertical bars, green → olive → brown -->
    <rect x="44"  y="248" width="9" height="24"  rx="4.5" fill="#1A3D2E"/>
    <rect x="74"  y="220" width="9" height="80"  rx="4.5" fill="#1F432F"/>
    <rect x="104" y="186" width="9" height="148" rx="4.5" fill="#254932"/>
    <rect x="134" y="168" width="9" height="184" rx="4.5" fill="#2D5134"/>
    <rect x="164" y="238" width="9" height="44"  rx="4.5" fill="#365534"/>
    <rect x="194" y="200" width="9" height="120" rx="4.5" fill="#415932"/>
    <rect x="224" y="178" width="9" height="164" rx="4.5" fill="#4E5A2F"/>
    <rect x="254" y="163" width="9" height="194" rx="4.5" fill="#5C5A2B"/>
    <rect x="284" y="135" width="9" height="250" rx="4.5" fill="#6B5726"/>
    <rect x="314" y="143" width="9" height="234" rx="4.5" fill="#775224"/>
    <rect x="344" y="193" width="9" height="134" rx="4.5" fill="#7D4C27"/>
    <rect x="374" y="233" width="9" height="54"  rx="4.5" fill="#79432A"/>
    <rect x="404" y="173" width="9" height="174" rx="4.5" fill="#6C3A27"/>
    <rect x="434" y="208" width="9" height="104" rx="4.5" fill="#5D3122"/>
    <rect x="464" y="248" width="9" height="24"  rx="4.5" fill="#50291D"/>
  </g>
</svg>
