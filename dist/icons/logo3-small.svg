<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="40" ry="40"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- White background -->
    <rect width="512" height="512" fill="#FFFFFF"/>

    <!-- Page body -->
    <path d="
      M 0 0
      H 422
      L 512 90
      V 512
      H 0
      Z
    " fill="#F5F2EB"/>

    <!-- Fold flap -->
    <path d="
      M 422 0
      L 512 90
      H 452
      Q 422 90 422 60
      Z
    " fill="#EBE5D5"/>

    <!-- Shadow along crease line -->
    <line x1="422" y1="0" x2="512" y2="90" stroke="#C5BFB0" stroke-width="1" opacity="0.35"/>

    <!-- Document lines — 3 lines for small sizes -->
    <line x1="56" y1="130" x2="456" y2="130" stroke="#E0D9C8" stroke-width="6" stroke-linecap="round"/>
    <line x1="56" y1="272" x2="456" y2="272" stroke="#E0D9C8" stroke-width="6" stroke-linecap="round"/>
    <line x1="56" y1="414" x2="456" y2="414" stroke="#E0D9C8" stroke-width="6" stroke-linecap="round"/>

    <!-- Waveform bars: 7 bars, thicker, green → olive → brown -->
    <rect x="60"  y="220" width="18" height="80"  rx="9" fill="#1A3D2E"/>
    <rect x="120" y="175" width="18" height="170" rx="9" fill="#2D5134"/>
    <rect x="180" y="200" width="18" height="120" rx="9" fill="#415932"/>
    <rect x="240" y="155" width="18" height="210" rx="9" fill="#5C5A2B"/>
    <rect x="300" y="145" width="18" height="230" rx="9" fill="#6B5726"/>
    <rect x="360" y="195" width="18" height="130" rx="9" fill="#7D4C27"/>
    <rect x="420" y="230" width="18" height="60"  rx="9" fill="#50291D"/>
  </g>
</svg>
